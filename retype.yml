input: ./src
output: docs
url: docs.amit.is-a.dev
branding:
  title: Docs
links:
  - text: Home
    link: index.md
    icon: home
  - text: Website
    link: https://amit.is-a.dev
    icon: globe
  - text: Github
    link: https://github.com/notamitgamer
    icon: mark-github
    target: blank
  - text: Sponsor
    link: https://github.com/sponsors/notamitgamer
    icon: heart
    target: blank
edit:
  repo: "https://github.com/notamitgamer/docs"
  base: "/src"
  branch: "main"
  label: "Edit this page"
editor:
  enabled: true
generator:
  recase: all
markdown:
  lineBreaks: soft
meta:
  title: " | Docs"
search:
  hotkeys:
    - "/"
  maxResults: 20
  minChars: 2
  mode: full
  noResultsFoundMsg: "No results"
  placeholder: Search
start:
  open: false
snippets:
  lineNumbers:
    - js
    - none
templating:
  enabled: true
  liquid: false
footer:
  copyright: "&copy; 2025-2026 amit.is-a.dev - All Rights Reserved."
  links:
    - text: notamitgamer/docs
      link: https://github.com/notamitgamer/docs
